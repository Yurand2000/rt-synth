[package]
name = "rt-synth"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.191"
libtux = { git = "https://github.com/Yurand2000/libtux", default-features = false, features = [
    "clock",
    "cpuset",
    "time",
    "sched",
    "signal",
    "libc",
    "serde",
] }
serde = "1.0.228"
